name: Literature watcher

on:
  schedule:
    - cron: "17 1 * * *"        # every day 01:17 UTC = 06:47 IST
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      days:
        description: "Look-back window in days (leave blank to use config/watch.yaml)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: atlas-write
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Look for new papers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          DAYS: ${{ inputs.days }}
        run: python scripts/watch.py ${DAYS:+--days "$DAYS"}

      - name: Remember what was proposed
        run: |
          git config user.name  "bioqubit-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.txt
          if ! git diff --cached --quiet; then
            git commit -m "watcher: record proposed candidates"
            git pull --rebase --quiet
            git push
          fi
