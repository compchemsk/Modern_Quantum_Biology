name: Build & validate

on:
  push:
    branches: [main]
    paths: ["data/papers.yaml", "config/**", "templates/**", "scripts/**", "docs/index.html"]
  pull_request:
    paths: ["data/**", "config/**", "templates/**", "scripts/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests (including from forks) only get a read-only check.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml==6.0.2
      - run: python scripts/build.py --check
      - run: python tests/test_pipeline.py

  # Only pushes to main (by you or the bot) rebuild and commit.
  rebuild:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: atlas-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Rebuild and commit
        run: |
          python scripts/build.py
          git config user.name  "bioqubit-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CITATION.cff RESOURCES.md bibliography docs .github/ISSUE_TEMPLATE
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate README, site data and BibTeX"
            git pull --rebase --quiet
            git push
          fi
