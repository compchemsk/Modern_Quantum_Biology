# Which tiers reach you. Remove "specialist" if you only want flagship venues.
accept_tiers: [high_impact, specialist, preprint]

# --------------------------- relevance scoring ----------------------------
# Text is lower-cased and hyphens become spaces, so "radical-pair" == "radical pair".
# A phrase ending in * matches as a prefix ("mitochondri*" -> mitochondrial).
# Each phrase counts once; a hit in the TITLE counts double.
# A candidate passes if:
#   (a) it hits at least one `core` or `platform` phrase and total >= min_score, or
#   (b) it hits at least one `bio` AND one `spin` phrase and total >= min_score_without_core.
keywords:
  core:            # weight 4 — inherently "quantum + biology"
    - radical pair*
    - spin correlated radical*
    - biological qubit*
    - protein qubit*
    - bioqubit*
    - genetically encoded qubit*
    - quantum biology
    - quantum biological
    - magnetoreception
    - magnetoreceptor*
    - magnetosensitiv*
    - magnetic field effect*
    - posner molecule*
    - posner cluster*
    - calcium phosphate dimer*
    - maglov*
    - photo cidnp
    - chemically induced dynamic nuclear polari*
    - quantum zeno
  platform:        # weight 4 — counts like `core`. The photochemistry of the
                   # protein platforms biological qubits are built on.
                   # Delete this group (and the platform queries) to stop tracking it.
    - aslov2
    - lov2 domain*
    - avena sativa lov*
    - phototropin*
    - cysteinyl flavin adduct*
    - flavin cysteinyl adduct*
    - flavin adduct*
    - photoadduct*
  bio:             # weight 2
    - cryptochrome*
    - flavin*
    - fmn
    - fad
    - flavoprotein*
    - lov domain*
    - lov2
    - fluorescent protein*
    - tryptophan
    - in vivo
    - living cell*
    - live cell*
    - e. coli
    - c. elegans
    - protein*
    - enzyme*
    - mitochondri*
    - neuron*
    - photoreceptor*
    - phototropin*
    - migratory bird*
  spin:            # weight 2
    - spin qubit*
    - qubit*
    - quantum bit*
    - hyperfine
    - spin coherence
    - spin dynamics
    - singlet triplet
    - triplet state*
    - odmr
    - optically detected magnetic resonance
    - electron paramagnetic resonance
    - epr
    - nuclear spin*
    - quantum sensing
    - quantum sensor*
    - entangle*
    - decoherence
    - coherent control
    - magnetic resonance
  negative:        # weight -6 — common quantum-computing noise
    - variational quantum eigensolver
    - quantum annealing
    - quantum machine learning
    - quantum neural network*
    - quantum computing for drug
    - drug discovery
    - quantum inspired
    - superconducting qubit*
    - trapped ion*
    - stock market
    - decision making model*
    - quantum probability

# keyword -> suggested category (first match wins, top to bottom)
category_hints:
  - [qubit*, biological-qubits]
  - [genetically encoded, biological-qubits]
  - [maglov, biological-qubits]
  - [quantum sens*, biological-qubits]
  - [posner*, posner]
  - [calcium phosphate, posner]
  - [cidnp, flavin-spin]
  - [lov domain, lov]
  - [lov2, lov]
  - [microscop*, methods]
  - [spectroscop*, methods]
  - [cryptochrome, radical-pair]
  - [magnetoreception, radical-pair]
  - [radical pair*, radical-pair]
  - [master equation, theory]
  - [open quantum system*, theory]
  - [simulat*, theory]
  - [review*, reviews]
