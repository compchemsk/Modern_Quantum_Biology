# ---------------------------------------------------------------------------
#  Literature watcher configuration  (read by scripts/watch.py)
#  Tune this file freely; no code changes needed.
# ---------------------------------------------------------------------------

# GitHub usernames allowed to /approve or /reject. The repository owner is
# always a curator; add co-curators (e.g. your students) here.
curators: [compchemsk]

# Put a collapsed abstract in each candidate issue? Issues in a public repo are
# public, and abstracts are publisher text — so this is off by default.
include_abstract: false

# Contact address sent to OpenAlex/Crossref "polite pool" (faster, more reliable).
contact_email: soumyajitkarmakar.iit@gmail.com

# How many days back each run looks. Runs are daily, but indexing lags by days,
# so a 21-day window with de-duplication guarantees nothing slips through.
lookback_days: 21

# Hard cap on new issues opened per run (protects you from a flood if a
# keyword turns out to be too broad).
max_issues_per_run: 15

# Minimum relevance score for a candidate to reach you (see `keywords`).
min_score: 6
# Stricter bar for papers with no `core` phrase (only bio + spin words) — keeps
# out routine EPR/NMR structural biology while letting "protein qubit" papers in.
min_score_without_core: 14

# --------------------------- where to look --------------------------------
sources:
  openalex: true      # all journals + bioRxiv/ChemRxiv/arXiv, with abstracts
  arxiv: true         # quant-ph, physics.bio-ph, physics.chem-ph, q-bio — same-day
  europepmc: true     # PubMed + bioRxiv/medRxiv — fast for life-science venues

arxiv_categories: [quant-ph, physics.bio-ph, physics.chem-ph, q-bio.BM, q-bio.SC, cond-mat.soft]

# Search phrases sent to every source (title + abstract). Keep them specific;
# the scorer below does the fine filtering.
queries:
  - "radical pair"
  - "spin-correlated radical pair"
  - "biological qubit"
  - "protein qubit"
  - "fluorescent protein qubit"
  - "genetically encoded qubit"
  - "genetically encoded spin"
  - "quantum biology"
  - "magnetoreception"
  - "cryptochrome magnetic"
  - "magnetic field effect protein"
  - "magnetic field effect fluorescence"
  - "MagLOV"
  - "Posner molecule"
  - "nuclear spin cognition"
  - "photo-CIDNP flavin"
  - "optically detected magnetic resonance protein"
  - "quantum sensing living cells"
  - "spin chemistry biology"
  - "LOV domain magnetic"
  # --- platform watch: LOV / phototropin photochemistry (delete to stop) ---
  - "AsLOV2"
  - "LOV2 domain"
  - "phototropin LOV"
  - "flavin photocycle"

# --------------------------- which venues ---------------------------------
# Tier decides the label on the issue and whether the venue is accepted.
# Matching is case-insensitive on the venue name returned by the API.
venues:
